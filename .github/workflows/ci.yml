name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend checks & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ufazhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/ufazhub_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/ufazhub_test
      REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: uv sync --frozen --dev

      # black is pinned in backend/pyproject.toml / uv.lock — same version as
      # the local pre-commit hook. CI never writes to the repo.
      - name: Check formatting with black
        run: uv run black --check app tests scripts

      # The schema in the models must equal what the migrations build.
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run backend tests
        run: uv run pytest -q --cov=app.services --cov-report=term-missing --cov-fail-under=85

      - name: Audit Python dependencies
        run: uv run pip-audit

  frontend:
    name: Frontend checks & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # One Node version everywhere: CI 24 == frontend/Dockerfile (node:24-slim)
      # == frontend/.nvmrc.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting with prettier
        run: npm run format:check

      - name: Run frontend lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # openapi.json is the contract: it must match the backend, and schema.d.ts
      # must match openapi.json. Fix locally with `make typegen`.
      - name: Check OpenAPI types are not stale
        run: |
          cd ../backend && uv sync --frozen && uv run python scripts/export_openapi.py | diff - ../frontend/openapi.json
          cd ../frontend && npm run typegen && git diff --exit-code src/lib/api/schema.d.ts

      - name: Build frontend
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            TARGET_SECRET="${{ secrets.EC2_TARGET_DIR }}"
            if [ -n "$TARGET_SECRET" ] && [ -d "$TARGET_SECRET" ]; then
              cd "$TARGET_SECRET"
            elif [ -d "$HOME/ufazhub" ]; then
              cd "$HOME/ufazhub"
            else
              echo "Could not find the ufazhub directory!"
              exit 1
            fi
            echo "Working directory: $(pwd)"

            echo "Pulling latest changes from main branch..."
            git pull origin main

            echo "Building Docker containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build

            echo "Starting containers in detached mode..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "Cleaning up unused Docker images..."
            docker image prune -f

            echo "Deployment to AWS finished successfully!"
