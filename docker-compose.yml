services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ufazhub}
      POSTGRES_USER: ${POSTGRES_USER:-ufaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ufaz} -d ${POSTGRES_DB:-ufazhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Daily pg_dump into ./backups/ + best-effort Telegram off-site copy.
  # Restarts skip the initial dump when the newest backup is still fresh.
  # See DEPLOYMENT.md → "Database backups". A dump now: make backup-now.
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env  # TELEGRAM_BOT_TOKEN for the off-site copy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-ufaz}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me}
      PGDATABASE: ${POSTGRES_DB:-ufazhub}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_TELEGRAM_CHAT_ID: ${BACKUP_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./backups:/backups

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./backend/secrets:/app/secrets:ro
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ufaz}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-ufazhub}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --timeout-graceful-shutdown drains in-flight requests on SIGTERM.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --timeout-graceful-shutdown 20"

  # Background jobs (arq): emails, link checks, previews, digests, retention.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ufaz}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-ufazhub}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
    command: arq app.worker.WorkerSettings

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Server components call the API over the compose network.
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
